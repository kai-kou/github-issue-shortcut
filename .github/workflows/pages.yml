name: Deploy LP

# site/ のランディングページを GitHub Pages へ公開する。
# アプリ本体（Cloudflare Workers）とは別系統で、Pages に載せるのは site/ 配下だけ。
# docs/ 等のリポジトリ内ドキュメントは公開対象に含めない。
#
# 前提: リポジトリ設定 Settings → Pages → Build and deployment の Source が
# 「GitHub Actions」であること（未設定だと deploy-pages が失敗する）。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 既定は権限なし。必要な権限は deploy ジョブにだけ与える。
permissions: {}

# 公開は直列化する。進行中のデプロイは打ち切らない（公開途中で止めない）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch は任意のブランチを選べるため、公開元を main に限定する
    # （作業ブランチの site/ が本番 Pages に載るのを防ぐ）。
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Action はすべてコミット SHA に固定する（タグは差し替え可能なため）。
      # リポジトリ設定の "Require actions to be pinned to a full-length commit SHA" が
      # これを機械強制する。バージョン更新は Dependabot（github-actions・weekly）が追う。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 後続ステップから読める GITHUB_TOKEN を .git/config に残さない
          persist-credentials: false

      # LP はビルド不要（依存ゼロの静的ファイル）なので、site/ をそのまま成果物にする。
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # actions/upload-pages-artifact は使えない（#244）。あちらは内部で
      # actions/upload-artifact@v4 を **タグ参照** で呼んでおり、リポジトリ設定の
      # "Require actions to be pinned to a full-length commit SHA" が推移的な依存にも
      # 効くため、こちらが SHA 固定していてもデプロイが弾かれる。
      # 同等の処理（Pages 用の tar を作り github-pages という名前で上げる）を自前で行い、
      # upload-artifact を直接 SHA 固定で呼ぶ。成果物の形式は upload-pages-artifact と同じ。
      - name: Pages 用の tar を作成する
        run: |
          tar --dereference --hard-dereference \
            --exclude=.git --exclude=.github \
            -cvf "$RUNNER_TEMP/artifact.tar" -C site .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # deploy-pages が探す既定の artifact 名。変更しないこと
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
