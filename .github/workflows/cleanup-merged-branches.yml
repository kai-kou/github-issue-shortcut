name: Cleanup merged branches

# マージ済み PR の作業ブランチを削除する手動ワークフロー。
#
# なぜ Actions でやるか: Claude Code のクラウドセッションからは ref 削除ができない
# （git プロキシ・GitHub MCP・REST API 直叩きの 3 経路すべてが塞がっている。
#  実測と根拠は docs/rules/github-mcp-fallback-patterns.md §3.1）。
# GitHub Actions は GitHub 側で実行されるためこの制約を受けず、`GITHUB_TOKEN` で削除できる。
#
# 既定は dry-run。実際に削除するときだけ dry_run を false にして起動する。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら削除せず対象一覧のみ出力する（既定 true）"
        type: boolean
        default: true
      extra_branches:
        description: "既定の条件から外れるが削除したいブランチ（カンマ区切り・任意）"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // workflow_dispatch の inputs は boolean 型でも文字列 'true'/'false' で渡る。
            // 未指定・想定外の値はすべて dry-run に倒す（誤削除より空振りを選ぶ）。
            const dryRun = String(context.payload.inputs?.dry_run ?? 'true') !== 'false';
            const extra = new Set(
              String(context.payload.inputs?.extra_branches ?? '')
                .split(',').map((s) => s.trim()).filter(Boolean),
            );

            const { owner, repo } = context.repo;

            // 既定ブランチは API から取得する（ハードコードしない）
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;

            // 明示的に守るブランチ。既定ブランチに加えて、履歴上の意味があるものを列挙する。
            const NEVER_DELETE = new Set([defaultBranch, 'bootstrap-main']);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100,
            });

            // マージ済み PR の head（削除候補・head SHA も控える）と、オープン PR の head / base（保護対象）。
            // base も守るのは、base ブランチを消すと GitHub がそのオープン PR を強制クローズするため。
            const mergedHeads = new Map(); // branch -> { pr, sha }
            const openHeads = new Set();
            const openBases = new Set();
            for (const pr of pulls) {
              if (pr.state === 'open') {
                openBases.add(pr.base.ref); // base は fork PR でも自リポジトリのブランチ
                if (pr.head?.repo?.full_name === `${owner}/${repo}`) openHeads.add(pr.head.ref);
                continue;
              }
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue; // fork からの PR は削除対象にしない
              if (pr.merged_at && !mergedHeads.has(pr.head.ref)) {
                mergedHeads.set(pr.head.ref, { pr: pr.number, sha: pr.head.sha });
              }
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            const targets = [];
            const skipped = [];
            for (const b of branches) {
              const merged = mergedHeads.get(b.name);
              // 保護判定を先に評価する。extra_branches で指定されても保護対象は絶対に消さない。
              let reason = null;
              if (NEVER_DELETE.has(b.name)) reason = '保護対象';
              else if (b.protected) reason = 'protected branch';
              else if (openHeads.has(b.name)) reason = 'オープン PR の head';
              else if (openBases.has(b.name)) reason = 'オープン PR の base';
              else if (extra.has(b.name)) reason = null; // 明示指定（検証済み前提）
              else if (!merged) reason = 'マージ済み PR に紐づかない';
              // ブランチ名が一致していても、マージ後に force-push / 追加コミットが載っていれば
              // それは PR に含まれない未レビューの作業。名前一致だけで消さない。
              else if (merged.sha !== b.commit.sha) reason = `PR #${merged.pr} の head SHA と不一致（マージ後に更新された可能性）`;

              if (reason) skipped.push({ name: b.name, reason });
              else targets.push({ name: b.name, sha: b.commit.sha, pr: merged?.pr ?? null });
            }

            core.info(`既定ブランチ: ${defaultBranch} / dry_run: ${dryRun}`);
            core.info(`削除対象: ${targets.length} 本 / 残す: ${skipped.length} 本`);
            for (const t of targets) {
              core.info(`  削除: ${t.name} (${t.sha.slice(0, 7)}${t.pr ? `, PR #${t.pr}` : ', 明示指定'})`);
            }
            for (const s of skipped) {
              core.info(`  残す: ${s.name} — ${s.reason}`);
            }

            const failed = [];
            if (!dryRun) {
              for (const t of targets) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${t.name}` });
                } catch (e) {
                  failed.push({ name: t.name, error: e.message });
                  core.warning(`削除失敗: ${t.name} — ${e.message}`);
                }
              }
            }

            // 実行結果をサマリーに残す（復元できるよう SHA を必ず記録する）
            const lines = [
              `## Cleanup merged branches`,
              ``,
              `- モード: **${dryRun ? 'dry-run（削除していない）' : '実削除'}**`,
              `- 削除${dryRun ? '対象' : '済み'}: **${targets.length - failed.length} 本**`,
              failed.length ? `- 失敗: **${failed.length} 本**` : null,
              `- 残した: ${skipped.length} 本`,
              ``,
              `### ${dryRun ? '削除対象' : '削除したブランチ'}`,
              ``,
              `| ブランチ | SHA（復元用） | 紐づく PR |`,
              `|---|---|---|`,
              ...targets.map((t) => `| \`${t.name}\` | \`${t.sha}\` | ${t.pr ? `#${t.pr}` : '明示指定'} |`),
              ``,
              `### 残したブランチ`,
              ``,
              `| ブランチ | 理由 |`,
              `|---|---|`,
              ...skipped.map((s) => `| \`${s.name}\` | ${s.reason} |`),
            ].filter((l) => l !== null);
            await core.summary.addRaw(lines.join('\n')).write();

            if (failed.length) core.setFailed(`${failed.length} 本の削除に失敗した`);
